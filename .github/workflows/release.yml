name: Build EasyReader Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Piper model
        run: python models/download_model.py

      - name: Build Windows package
        shell: cmd
        run: call build\build_release.bat

      - name: Verify package
        shell: powershell
        run: |
          if (!(Test-Path "release/EasyReader-V1.0-Windows-x64.zip")) { throw "Release package missing" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EasyReader-V1.0-Windows-x64
          path: release/EasyReader-V1.0-Windows-x64.zip

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/EasyReader-V1.0-Windows-x64.zip
          generate_release_notes: true
