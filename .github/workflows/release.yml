name: Build EasyReader Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, example: v1.1.0"
        required: true
        default: "v1.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download Piper model
      shell: cmd
      run: |
        python models\download_model.py

    - name: Build EXE
      shell: cmd
      run: |
        pyinstaller --clean --noconfirm EasyReader.spec

    - name: Prepare package
      shell: cmd
      run: |
        mkdir release\EasyReader-Windows-x64
        xcopy dist\EasyReader release\EasyReader-Windows-x64\EasyReader /E /I /Y /Q
        xcopy models release\EasyReader-Windows-x64\EasyReader\models /E /I /Y /Q
        copy README.md release\EasyReader-Windows-x64\
        copy LICENSE release\EasyReader-Windows-x64\

    - name: Create ZIP
      shell: powershell
      run: |
        Compress-Archive -Path release\EasyReader-Windows-x64 -DestinationPath EasyReader-Windows-x64.zip -Force

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: EasyReader-Windows-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
