name: Build EasyReader Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, example: v1.1.0"
        required: true
        default: "v1.1.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Download Piper model
      shell: cmd
      run: |
        python models\download_model.py
        if not exist models\zh_CN-huayan-medium.onnx exit /b 1

    - name: Build EXE
      shell: cmd
      run: |
        pyinstaller --clean --noconfirm EasyReader.spec
        if not exist dist\EasyReader.exe exit /b 1

    - name: Prepare package
      shell: cmd
      run: |
        mkdir release\EasyReader-Windows-x64\EasyReader
        copy dist\EasyReader.exe release\EasyReader-Windows-x64\EasyReader\
        xcopy models release\EasyReader-Windows-x64\EasyReader\models /E /I /Y /Q
        if exist documents xcopy documents release\EasyReader-Windows-x64\EasyReader\documents /E /I /Y /Q
        copy README.md release\EasyReader-Windows-x64\
        if exist LICENSE copy LICENSE release\EasyReader-Windows-x64\

    - name: Verify package
      shell: cmd
      run: |
        if not exist release\EasyReader-Windows-x64\EasyReader\EasyReader.exe exit /b 1
        if not exist release\EasyReader-Windows-x64\EasyReader\models\zh_CN-huayan-medium.onnx exit /b 1

    - name: Create ZIP
      shell: powershell
      run: |
        Compress-Archive -Path release\EasyReader-Windows-x64 -DestinationPath EasyReader-Windows-x64.zip -Force

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.version || github.ref_name }}
        name: EasyReader ${{ inputs.version || github.ref_name }}
        files: EasyReader-Windows-x64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
