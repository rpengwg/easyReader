name: Build EasyReader Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag, example: v1.1.2"
        required: true
        default: "v1.1.2"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      shell: cmd
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Prepare external model directory
      shell: cmd
      run: |
        if not exist models\piper mkdir models\piper
        if not exist models\piper\README.txt echo Piper models are external files. Copy ONNX and JSON model files here. > models\piper\README.txt

    - name: Check model directory
      shell: cmd
      run: |
        python models\download_model.py

    - name: Build EXE
      shell: cmd
      run: |
        pyinstaller --clean --noconfirm EasyReader.spec
        if not exist dist\EasyReader.exe exit /b 1

    - name: Prepare package
      shell: cmd
      run: |
        mkdir release\EasyReader-Windows-x64\EasyReader
        copy dist\EasyReader.exe release\EasyReader-Windows-x64\EasyReader\
        if not exist release\EasyReader-Windows-x64\EasyReader\models\piper mkdir release\EasyReader-Windows-x64\EasyReader\models\piper
        copy models\piper\README.txt release\EasyReader-Windows-x64\EasyReader\models\piper\
        if exist config xcopy config release\EasyReader-Windows-x64\EasyReader\config /E /I /Y /Q
        if exist documents xcopy documents release\EasyReader-Windows-x64\EasyReader\documents /E /I /Y /Q
        copy README.md release\EasyReader-Windows-x64\
        if exist CHANGELOG.md copy CHANGELOG.md release\EasyReader-Windows-x64\
        if exist LICENSE copy LICENSE release\EasyReader-Windows-x64\
        echo EasyReader Version > release\EasyReader-Windows-x64\VERSION.txt
        echo ${{ inputs.version || github.ref_name }} >> release\EasyReader-Windows-x64\VERSION.txt

    - name: Verify package
      shell: cmd
      run: |
        if not exist release\EasyReader-Windows-x64\EasyReader\EasyReader.exe exit /b 1
        if not exist release\EasyReader-Windows-x64\EasyReader\models\piper\README.txt exit /b 1

    - name: Create ZIP
      shell: powershell
      run: |
        Compress-Archive -Path release\EasyReader-Windows-x64 -DestinationPath EasyReader-Windows-x64.zip -Force

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ inputs.version || github.ref_name }}
        name: EasyReader ${{ inputs.version || github.ref_name }}
        body_path: CHANGELOG.md
        files: EasyReader-Windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
